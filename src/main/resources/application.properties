# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=8080

# ===================================================================
# POSTGRESQL DATABASE CONNECTION CONFIGURATION
# ===================================================================
# Change 'estudiantes_db' to your database name if different
spring.datasource.url=jdbc:postgresql://localhost:5432/estudiantes_db
spring.datasource.username=postgres
spring.datasource.password=1709
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# SPRING DATA JPA / HIBERNATE CONFIGURATION
# ===================================================================
# update: automatically update schema on startup without wiping existing data
spring.jpa.hibernate.ddl-auto=update

# Print and format SQL queries in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
