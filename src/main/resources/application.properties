# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=${SERVER_PORT:8080}

# ===================================================================
# POSTGRESQL DATABASE CONNECTION CONFIGURATION
# ===================================================================
# Supports Docker environment variables with local fallback defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/estudiantes_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1709}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# SPRING DATA JPA / HIBERNATE CONFIGURATION
# ===================================================================
# update: automatically update schema on startup without wiping existing data
spring.jpa.hibernate.ddl-auto=update

# Print and format SQL queries in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
