# ===================================================================
# CONFIGURACIÓN DEL SERVIDOR
# ===================================================================
server.port=8080

# ===================================================================
# CONFIGURACIÓN DE CONEXIÓN A BASE DE DATOS POSTGRESQL
# ===================================================================
# Cambia 'estudiantes_db' por el nombre de tu base de datos si usaste otro
spring.datasource.url=jdbc:postgresql://localhost:5432/estudiantes_db
spring.datasource.username=postgres
spring.datasource.password=1709
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACIÓN DE SPRING DATA JPA / HIBERNATE
# ===================================================================
# update: actualiza el esquema automáticamente al iniciar sin borrar datos existentes
spring.jpa.hibernate.ddl-auto=update

# Mostrar y formatear consultas SQL en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
