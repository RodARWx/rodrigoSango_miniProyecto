# ==============================================================================
# Nginx Web Server Configuration
# ==============================================================================
# Serves:
# 1. Student Academic Management Portal at / (root)
# 2. Rick & Morty Exploration Portal at /rick-morty/ (subpath)
# 3. Reverse proxies /api/ requests to Spring Boot backend (http://backend:8080/api/)
# ==============================================================================

# ==============================================================================
# Rate Limiting Governance (WEB-33)
# ==============================================================================
# 10MB shared memory zone tracks ~160,000 IPs with a rate of 15 req/sec
limit_req_zone $binary_remote_addr zone=api_gateway_zone:10m rate=15r/s;
limit_req_status 429;

# ==============================================================================
# Upstream Backend Cluster: Layer 7 Load Balancing (WEB-35)
# ==============================================================================
upstream backend_cluster {
    # Layer 7 load balancing algorithm: least connections
    least_conn;

    # Backend service replicas target with passive health checking
    server backend:8080 max_fails=3 fail_timeout=10s;

    # Maintain pool of keepalive connections to upstreams
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Global document root for static assets
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for accelerated asset delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ==========================================================================
    # Gateway Health Probe Endpoint (WEB-37)
    # ==========================================================================
    location ~* ^/(api/)?(v1/)?health$ {
        rewrite ^.*$ /api/estudiantes/health break;
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Gateway-Version "v1";
    }

    # ==========================================================================
    # API Gateway: Versioned Routing Layer (/api/v1/)
    # ==========================================================================
    location /api/v1/ {
        # Rate Limiting: 15r/s with burst of 25 and no artificial delay
        limit_req zone=api_gateway_zone burst=25 nodelay;

        # Upstream path rewriting: maps /api/v1/(.*) to /api/$1
        rewrite ^/api/v1/(.*)$ /api/$1 break;
        proxy_pass http://backend_cluster;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Gateway-Version "v1";

        # Intercept proxy errors to return uniform JSON payloads
        proxy_intercept_errors on;
        error_page 429 = @rate_limited_json;
        error_page 502 503 504 = @gateway_error_json;

        # CORS Policy
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Gateway connection and response timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ==========================================================================
    # API Gateway: Backward-Compatible Legacy Routing (/api/)
    # ==========================================================================
    location /api/ {
        # Rate Limiting applied to legacy entrypoint
        limit_req zone=api_gateway_zone burst=25 nodelay;

        proxy_pass http://backend_cluster/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Gateway-Version "v1-legacy";

        # Intercept proxy errors for uniform JSON payloads
        proxy_intercept_errors on;
        error_page 429 = @rate_limited_json;
        error_page 502 503 504 = @gateway_error_json;

        # Standard connection and response timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ==========================================================================
    # Subproject: Rick & Morty Exploration Portal
    # ==========================================================================
    location /rick-morty/ {
        try_files $uri $uri/ /rick-morty/index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Redirect /rick-morty without trailing slash to /rick-morty/
    location = /rick-morty {
        return 301 /rick-morty/;
    }

    # ==========================================================================
    # Main Application: Student Management Portal
    # ==========================================================================
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ==========================================================================
    # Uniform Gateway JSON Error Handlers (WEB-33)
    # ==========================================================================
    location @rate_limited_json {
        default_type application/json;
        return 429 '{"status":429,"error":"Too Many Requests","message":"API rate limit exceeded. Please throttle client requests and try again later.","gatewayVersion":"v1"}';
    }

    location @gateway_error_json {
        default_type application/json;
        return 502 '{"status":502,"error":"Bad Gateway","message":"The upstream backend service is temporarily unavailable or unreachable.","gatewayVersion":"v1"}';
    }

    # Standard static error pages for browser navigation
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
