# ==============================================================================
# Nginx Web Server Configuration
# ==============================================================================
# Serves:
# 1. Student Academic Management Portal at / (root)
# 2. Rick & Morty Exploration Portal at /rick-morty/ (subpath)
# 3. Reverse proxies /api/ requests to Spring Boot backend (http://backend:8080/api/)
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Global document root for static assets
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for accelerated asset delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ==========================================================================
    # API Reverse Proxy Routing
    # ==========================================================================
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard connection and response timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==========================================================================
    # Subproject: Rick & Morty Exploration Portal
    # ==========================================================================
    location /rick-morty/ {
        try_files $uri $uri/ /rick-morty/index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Redirect /rick-morty without trailing slash to /rick-morty/
    location = /rick-morty {
        return 301 /rick-morty/;
    }

    # ==========================================================================
    # Main Application: Student Management Portal
    # ==========================================================================
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Standard error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
